services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  firebird:
    image: firebirdsql/firebird:latest
    container_name: firebird_db
    restart: unless-stopped
    environment:
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD}
      FIREBIRD_USER: ${FIREBIRD_USER}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}
      FIREBIRD_DATABASE: college.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3050:3050"
    volumes:
      - firebird_data:/var/lib/firebird/data
      - ./db-init/firebird-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    container_name: python_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=firebird
      - DB_PORT=3050
      - DB_NAME=/var/lib/firebird/data/college.fdb
      - DB_USER=${FIREBIRD_USER}
      - DB_PASSWORD=${FIREBIRD_PASSWORD}
    depends_on:
      - firebird
    networks:
      - app-network

  csharp-api:
    build:
      context: ./csharp-api
      dockerfile: Dockerfile
    container_name: csharp_api
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
    depends_on:
      - mysql
    networks:
      - app-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - python-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  firebird_data:
